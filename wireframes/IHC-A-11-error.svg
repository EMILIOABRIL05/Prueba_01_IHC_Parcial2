<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-label="IHC-A-11 error"><rect width="360" height="760" fill="#f8fafc"/><rect x="10" y="10" width="340" height="740" rx="12" fill="white" stroke="#475569"/><text x="24" y="40" font-family="Arial" font-size="16" font-weight="bold">Dashboard UX · IHC-A-11</text><text x="24" y="64" font-family="Arial" font-size="12">error · Lo-Fi conceptual de 360 px</text><rect x="22" y="90" width="316" height="135" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="34" y="114" font-family="Arial" font-size="13" font-weight="bold">Problema que se explica</text><text x="34" y="147" font-family="Arial" font-size="12">Corrija el campo sin perder los otros</text><text x="34" y="162" font-family="Arial" font-size="12">datos.</text><rect x="22" y="240" width="316" height="135" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="34" y="264" font-family="Arial" font-size="13" font-weight="bold">Información conservada</text><text x="34" y="297" font-family="Arial" font-size="12">Datos, marcas, errores y observaciones</text><rect x="22" y="390" width="316" height="135" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="34" y="414" font-family="Arial" font-size="13" font-weight="bold">Foco y recuperación</text><text x="34" y="447" font-family="Arial" font-size="12">Casilla / control que requiere atención</text><rect x="22" y="540" width="316" height="135" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="34" y="564" font-family="Arial" font-size="13" font-weight="bold">Acción segura</text><text x="34" y="597" font-family="Arial" font-size="12">Volver, corregir o cancelar; no se</text><text x="34" y="612" font-family="Arial" font-size="12">declara éxito</text><text x="24" y="730" font-family="Arial" font-size="11">Diseño de estructura; interacción en prototipo/v2</text></svg>
