<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="940" viewBox="0 0 1640 940"><rect width="1640" height="940" fill="#e2e8f0"/><text x="40" y="48" font-family="Arial" font-size="26" font-weight="bold">IHC-A-02 · Pedido completo por teclado</text><text x="40" y="82" font-family="Arial" font-size="16">Arquitectura del equipo · revisión integral de William Martínez · cuatro estados Lo-Fi</text><g transform="translate(40,130)"><rect width="360" height="760" fill="#f8fafc"/><rect x="10" y="10" width="340" height="740" rx="12" fill="white" stroke="#475569"/><text x="24" y="40" font-family="Arial" font-size="16" font-weight="bold">CaféU · IHC-A-02</text><text x="24" y="64" font-family="Arial" font-size="12">inicio · Lo-Fi conceptual de 360 px</text><rect x="22" y="90" width="316" height="135" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="34" y="114" font-family="Arial" font-size="13" font-weight="bold">Objetivo de la tarea</text><text x="34" y="147" font-family="Arial" font-size="12">Editar y finalizar un pedido con Tab,</text><text x="34" y="162" font-family="Arial" font-size="12">Enter y Escape</text><rect x="22" y="240" width="316" height="135" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="34" y="264" font-family="Arial" font-size="13" font-weight="bold">Antes de comenzar</text><text x="34" y="297" font-family="Arial" font-size="12">Operar sin ratón y mantener el foco</text><text x="34" y="312" font-family="Arial" font-size="12">visible</text><rect x="22" y="390" width="316" height="135" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="34" y="414" font-family="Arial" font-size="13" font-weight="bold">Ruta visible</text><text x="34" y="447" font-family="Arial" font-size="12">Inicio &gt; Menú &gt; Mi pedido</text><rect x="22" y="540" width="316" height="135" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="34" y="564" font-family="Arial" font-size="13" font-weight="bold">Acción principal</text><text x="34" y="597" font-family="Arial" font-size="12">Ver menú disponible</text><text x="24" y="730" font-family="Arial" font-size="11">Diseño de estructura; interacción en prototipo/v2</text></g><g transform="translate(440,130)"><rect width="360" height="760" fill="#f8fafc"/><rect x="10" y="10" width="340" height="740" rx="12" fill="white" stroke="#475569"/><text x="24" y="40" font-family="Arial" font-size="16" font-weight="bold">CaféU · IHC-A-02</text><text x="24" y="64" font-family="Arial" font-size="12">accion · Lo-Fi conceptual de 360 px</text><rect x="22" y="90" width="316" height="135" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="34" y="114" font-family="Arial" font-size="13" font-weight="bold">Contexto y regreso</text><text x="34" y="147" font-family="Arial" font-size="12">Mi pedido / Ver detalle</text><rect x="22" y="240" width="316" height="135" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="34" y="264" font-family="Arial" font-size="13" font-weight="bold">Componente crítico</text><text x="34" y="297" font-family="Arial" font-size="12">Quitar, diálogo, Cancelar y foco por</text><text x="34" y="312" font-family="Arial" font-size="12">producto</text><rect x="22" y="390" width="316" height="135" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="34" y="414" font-family="Arial" font-size="13" font-weight="bold">Datos visibles</text><text x="34" y="447" font-family="Arial" font-size="12">Café $1,50; sánduche $2,75; cantidades y</text><text x="34" y="462" font-family="Arial" font-size="12">total</text><rect x="22" y="540" width="316" height="135" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="34" y="564" font-family="Arial" font-size="13" font-weight="bold">Acción y recuperación</text><text x="34" y="597" font-family="Arial" font-size="12">Editar / Quitar / Cancelar / Confirmar</text><text x="24" y="730" font-family="Arial" font-size="11">Diseño de estructura; interacción en prototipo/v2</text></g><g transform="translate(840,130)"><rect width="360" height="760" fill="#f8fafc"/><rect x="10" y="10" width="340" height=